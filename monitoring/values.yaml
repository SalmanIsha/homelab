# Configuration optimized for K3s clusters with resource optimization and high-availability distribution
global:
  scrape_interval: 60s

prometheus:
  prometheusSpec:
    # Reduce retention for edge/IoT deployments
    retention: 7d

    # 1. Distributed Scheduling: Keep Prometheus off 'prod' and spread across workers
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - prometheus
            topologyKey: "kubernetes.io/hostname"
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
              - prod

    # 2. Relaxed Probes: Prevents Kubernetes from prematurely restarting Prometheus during query spikes
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 10
      failureThreshold: 6

    # 3. Scaled Resource Limits: Prevents memory crashes while respecting your 4GB node constraints
    resources:
      requests:
        memory: 512Mi   # Increased from 256Mi to accommodate baseline metric tracking safely
        cpu: 200m       # Increased from 100m for smoother start-up handling
      limits:
        memory: 1500Mi  # Increased from 512Mi to prevent OOM termination during heavy dashboard rendering
        cpu: 800m

    # 4. Storage Configuration: Explicitly attached to Longhorn storage engine
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Additional scrape configs for K3s-specific endpoints
    additionalScrapeConfigs:
      # Scrape K3s server metrics
      - job_name: 'k3s-server'
        static_configs:
          - targets: ['localhost:10250']
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

grafana:
  enabled: true

  # 5. Distributed Scheduling: Pin Grafana away from the resource-constrained 'prod' node
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
            - prod

  # 6. Scaled Resource Limits: Fixes the explicit OOMKilled issue you hit (Exit Code 137)
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 768Mi    # Increased from 512Mi to support high-concurrent visualization loads
      cpu: 500m

# Component configurations optimized for K3s footprint
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m

# Use lighter-weight node exporter configuration
nodeExporter:
  enabled: true
  resources:
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 64Mi
      cpu: 100m

# Kube-state-metrics for Kubernetes object metrics
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
