apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate # Prevents file conflicts during updates
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      securityContext:
        fsGroup: 1000 # Matches Vikunja's default user ID
      containers:
        - name: vikunja
          image: vikunja/vikunja:latest
          ports:
            - containerPort: 3456
              name: http
          env:
            # Database Configuration
            - name: VIKUNJA_DATABASE_TYPE
              value: "sqlite"
            - name: VIKUNJA_DATABASE_PATH
              value: "/app/vikunja/files/vikunja.db"
            
            # Service Configuration
            - name: VIKUNJA_SERVICE_PUBLICURL
              value: "http://vikunja.salmanisha.com" 
            # Resource Allocations sized for Homelab usage
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m" # Prevents CPU throttling during heavy AI/automation loops
          
          # Health and Status Probes
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12 # Gives the app 60 seconds to finish database migrations on boot
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3 # Forcefully restarts the container if it deadlocks or freezes
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2 # Gates network traffic out if overloaded
          volumeMounts:
            - name: vikunja-data
              mountPath: /app/vikunja/files
      volumes:
        - name: vikunja-data
          persistentVolumeClaim:
            claimName: vikunja-data-pvc