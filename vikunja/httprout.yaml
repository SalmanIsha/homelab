---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vikunja-httproute

spec:
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  hostnames:
  - "vikunja.salmanisha.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: vikunja-svc
      port: 3456