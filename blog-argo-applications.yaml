apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-blog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SalmanIsha/homelab.git
    path: my-blog
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: blog
  syncPolicy:
    syncOptions:
    - CreateNamespace=true